name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q --junitxml=pytest-junit.xml
      - name: Test results summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("pytest-junit.xml").getroot()
          except (FileNotFoundError, ET.ParseError):
              print("## Test results\n\n_No test report produced._")
              raise SystemExit(0)

          suites = root.findall("testsuite") or [root]
          tests = failures = errors = skipped = 0
          time = 0.0
          failed = []
          for s in suites:
              tests += int(s.get("tests", 0))
              failures += int(s.get("failures", 0))
              errors += int(s.get("errors", 0))
              skipped += int(s.get("skipped", 0))
              time += float(s.get("time", 0) or 0)
              for case in s.findall("testcase"):
                  bad = case.find("failure") is not None or case.find("error") is not None
                  if bad:
                      name = f'{case.get("classname", "")}::{case.get("name", "")}'.strip(":")
                      failed.append(name)
          passed = tests - failures - errors - skipped
          icon = ":white_check_mark:" if not (failures or errors) else ":x:"
          print("## Test results\n")
          print("| Total | Passed | Failed | Errors | Skipped | Duration |")
          print("| --- | --- | --- | --- | --- | --- |")
          print(
              f"| {tests} | {passed} | {failures} | {errors} | {skipped} "
              f"| {time:.2f}s {icon} |"
          )
          if failed:
              print("\n<details><summary>Failed tests</summary>\n")
              for name in failed:
                  print(f"- `{name}`")
              print("\n</details>")
          PY
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- jobclient-coverage-report -->"
          {
            echo "$marker"
            echo "## Coverage"
            coverage report --format=markdown
          } > coverage-comment.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@coverage-comment.md >/dev/null
            echo "Updated coverage comment $id"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@coverage-comment.md >/dev/null
            echo "Created coverage comment"
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit deps (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit==2.7.3
          echo "## Dependency audit (pip-audit)" >> "$GITHUB_STEP_SUMMARY"
          set +e
          pip-audit -f markdown | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo ":white_check_mark: No known vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: CLI against a stub jobs API
        id: smoke
        run: |
          python tests/stub_api.py --port 8099 &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8099/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          out=$(JOB_API_URL=http://localhost:8099 python main.py settlement '{"region":"eu"}')
          echo "$out"
          echo "$out" | grep -q 'enqueued settlement as job 1'
          # second enqueue of the same type is a duplicate -> 409, exit 0
          dup=$(JOB_API_URL=http://localhost:8099 python main.py settlement)
          echo "$dup"
          echo "$dup" | grep -q 'skipped settlement'
          # the stub records the bearer token's scopes
          curl -fsS http://localhost:8099/_seen | tee seen.json
          grep -q 'jobs.write' seen.json
          echo "value=201 -> 409, scope jobs.write sent" >> "$GITHUB_OUTPUT"
      - name: Retries survive a flaky API
        id: retries
        run: |
          python tests/stub_api.py --port 8098 --fail-first 2 &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8098/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          out=$(JOB_API_URL=http://localhost:8098 JOB_API_BACKOFF_INITIAL=0.1 \
            python main.py settlement)
          echo "$out"
          echo "$out" | grep -q 'attempts: 3'
          echo "value=2x 503 then 201 (attempts: 3)" >> "$GITHUB_OUTPUT"
      - name: Smoke summary
        if: always()
        run: |
          {
            echo "## Smoke (real CLI over HTTP)"
            echo "| Check | Result | Value |"
            echo "| --- | --- | --- |"
            echo "| Enqueue + duplicate | ${{ steps.smoke.outcome == 'success' && ':white_check_mark: pass' || ':x: fail' }} | \`${{ steps.smoke.outputs.value }}\` |"
            echo "| Retry with backoff | ${{ steps.retries.outcome == 'success' && ':white_check_mark: pass' || ':x: fail' }} | \`${{ steps.retries.outputs.value }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
