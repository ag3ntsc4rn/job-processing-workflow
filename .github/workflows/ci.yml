name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q --junitxml=pytest-junit.xml
      - name: Test results summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("pytest-junit.xml").getroot()
          except (FileNotFoundError, ET.ParseError):
              print("## Test results\n\n_No test report produced._")
              raise SystemExit(0)

          suites = root.findall("testsuite") or [root]
          tests = failures = errors = skipped = 0
          time = 0.0
          failed = []
          for s in suites:
              tests += int(s.get("tests", 0))
              failures += int(s.get("failures", 0))
              errors += int(s.get("errors", 0))
              skipped += int(s.get("skipped", 0))
              time += float(s.get("time", 0) or 0)
              for case in s.findall("testcase"):
                  bad = case.find("failure") is not None or case.find("error") is not None
                  if bad:
                      name = f'{case.get("classname", "")}::{case.get("name", "")}'.strip(":")
                      failed.append(name)
          passed = tests - failures - errors - skipped
          icon = ":white_check_mark:" if not (failures or errors) else ":x:"
          print("## Test results\n")
          print("| Total | Passed | Failed | Errors | Skipped | Duration |")
          print("| --- | --- | --- | --- | --- | --- |")
          print(
              f"| {tests} | {passed} | {failures} | {errors} | {skipped} "
              f"| {time:.2f}s {icon} |"
          )
          if failed:
              print("\n<details><summary>Failed tests</summary>\n")
              for name in failed:
                  print(f"- `{name}`")
              print("\n</details>")
          PY
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Backend coverage"
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- backend-coverage-report -->"
          {
            echo "$marker"
            echo "## Backend coverage"
            coverage report --format=markdown
          } > coverage-comment.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@coverage-comment.md >/dev/null
            echo "Updated coverage comment $id"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@coverage-comment.md >/dev/null
            echo "Created coverage comment"
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit deps (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt pip-audit==2.7.3
          echo "## Dependency audit (pip-audit)" >> "$GITHUB_STEP_SUMMARY"
          set +e
          pip-audit -f markdown | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo ":white_check_mark: No known vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres + Kafka
        run: docker compose up -d --wait postgres kafka
      - name: Apply migrations
        run: docker compose run --rm migrate
      - name: Build service images
        run: docker compose build worker dispatcher handler handlerapi handlerapiv2
      - name: Start dispatcher + worker
        run: docker compose up -d dispatcher worker
      - name: Start API + mock OIDC
        run: docker compose up -d --wait handlerapi
      - name: Enqueue with a per-run override
        id: enqueue
        run: |
          out=$(docker compose run --rm handler hello '{"name":"Grace","extra":true}')
          echo "$out"
          echo "$out" | grep -q 'enqueued hello as job'
          echo "value=job enqueued" >> "$GITHUB_OUTPUT"
      - name: Effective payload = base config merged with input (input wins)
        id: merge
        run: |
          for i in $(seq 1 30); do
            row=$(docker compose exec -T postgres psql -U app -d app -tAc \
              "SELECT status||'|'||input_payload::text||'|'||payload::text FROM jobs WHERE job_type='hello' ORDER BY id DESC LIMIT 1")
            echo "attempt $i: $row"
            case "$row" in completed\|*) break;; esac
            sleep 2
          done
          echo "$row" | grep -q '^completed|'
          echo "$row" | grep -q '"name": "Grace"'
          echo "$row" | grep -q '"extra": true'
          echo "value=$row" >> "$GITHUB_OUTPUT"
      - name: Kafka envelope is pointer-only (job_id + job_type, no business payload)
        id: envelope
        run: |
          msg=$(docker compose exec -T kafka \
            /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic jobs \
            --from-beginning --max-messages 1 --timeout-ms 20000)
          echo "message: $msg"
          echo "$msg" | grep -q '"job_id"'
          echo "$msg" | grep -q '"job_type": "hello"'
          if echo "$msg" | grep -q '"name"'; then echo "envelope leaked business payload"; exit 1; fi
          echo "value=pointer envelope published" >> "$GITHUB_OUTPUT"
      - name: Missing config fails the run gracefully
        id: noconfig
        run: |
          docker compose run --rm handler ghost | grep -q 'enqueued ghost as job'
          for i in $(seq 1 30); do
            st=$(docker compose exec -T postgres psql -U app -d app -tAc \
              "SELECT status FROM jobs WHERE job_type='ghost' ORDER BY id DESC LIMIT 1")
            echo "attempt $i: ghost -> $st"
            [ "$st" = "failed" ] && break
            sleep 2
          done
          [ "$st" = "failed" ]
          echo "value=ghost -> failed" >> "$GITHUB_OUTPUT"
      - name: API - token -> POST -> GET, with authz
        id: api
        run: |
          docker compose exec -T handlerapi python - <<'PY'
          import httpx
          base = "http://localhost:8080"
          # unauthenticated write is rejected
          assert httpx.post(f"{base}/v1/jobs", json={"job_type": "settlement"}).status_code == 401
          tok = httpx.post("http://mock-oidc:8080/default/token",
                           data={"grant_type": "client_credentials",
                                 "client_id": "autosys-svc", "client_secret": "s"}
                           ).json()["access_token"]
          h = {"Authorization": f"Bearer {tok}"}
          r = httpx.post(f"{base}/v1/jobs", json={"job_type": "settlement", "payload": {"region": "eu"}}, headers=h)
          assert r.status_code == 201, r.text
          jid = r.json()["job_id"]
          g = httpx.get(f"{base}/v1/jobs/{jid}", headers=h).json()
          assert g["input_payload"] == {"region": "eu"}, g
          assert g["created_by"]["type"] == "service", g
          assert httpx.post(f"{base}/v1/jobs", json={"job_type": "settlement"}, headers=h).status_code == 409
          print("api ok: 401 -> 201 -> 200 -> 409")
          PY
          echo "value=401 -> 201 -> 200 -> 409" >> "$GITHUB_OUTPUT"
      - name: Start handlerAPIv2 + Keycloak
        run: docker compose up -d --wait handlerapiv2
      - name: Wait for Keycloak realm to import
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8083/realms/jobs/.well-known/openid-configuration >/dev/null 2>&1; then
              echo "keycloak ready after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "keycloak did not become ready"; docker compose logs keycloak; exit 1
      - name: APIv2 - Keycloak token -> POST -> GET, with authn + authz
        id: apiv2
        run: |
          docker compose exec -T handlerapiv2 python - <<'PY'
          import httpx
          base = "http://localhost:8080"
          kc = "http://keycloak:8080/realms/jobs/protocol/openid-connect/token"

          def token(client_id, secret):
              r = httpx.post(kc, data={"grant_type": "client_credentials",
                                       "client_id": client_id, "client_secret": secret})
              r.raise_for_status()
              return r.json()["access_token"]

          # authn: no bearer -> 401
          assert httpx.post(f"{base}/v1/jobs", json={"job_type": "reconcile"}).status_code == 401
          # authz: read-only client cannot enqueue -> 403
          ro = {"Authorization": f"Bearer {token('job-api-v2-reader', 'job-api-v2-reader-secret')}"}
          assert httpx.post(f"{base}/v1/jobs", json={"job_type": "reconcile"}, headers=ro).status_code == 403
          # read+write client: 201 -> 200 -> 409
          rw = {"Authorization": f"Bearer {token('job-api-v2-client', 'job-api-v2-secret')}"}
          r = httpx.post(f"{base}/v1/jobs", json={"job_type": "reconcile", "payload": {"region": "eu"}}, headers=rw)
          assert r.status_code == 201, r.text
          jid = r.json()["job_id"]
          g = httpx.get(f"{base}/v1/jobs/{jid}", headers=rw).json()
          assert g["input_payload"] == {"region": "eu"}, g
          assert g["created_by"]["type"] == "service", g
          # v2 reads are not ownership-gated: the read-only client can read it
          assert httpx.get(f"{base}/v1/jobs/{jid}", headers=ro).status_code == 200
          assert httpx.post(f"{base}/v1/jobs", json={"job_type": "reconcile"}, headers=rw).status_code == 409
          print("apiv2 ok: 401 -> 403 -> 201 -> 200 -> 409")
          PY
          echo "value=401 -> 403 -> 201 -> 200 -> 409" >> "$GITHUB_OUTPUT"
      - name: E2E summary
        if: always()
        run: |
          {
            echo "## End-to-end checks"
            echo "| Check | Result | Value |"
            echo "| --- | --- | --- |"
            echo "| Enqueue \`hello\` w/ override | ${{ steps.enqueue.outcome == 'success' && ':white_check_mark: pass' || ':x: fail' }} | \`${{ steps.enqueue.outputs.value }}\` |"
            echo "| Base⊕input effective payload | ${{ steps.merge.outcome == 'success' && ':white_check_mark: pass' || ':x: fail' }} | \`${{ steps.merge.outputs.value }}\` |"
            echo "| Pointer-only Kafka envelope | ${{ steps.envelope.outcome == 'success' && ':white_check_mark: pass' || ':x: fail' }} | \`${{ steps.envelope.outputs.value }}\` |"
            echo "| Missing config -> failed | ${{ steps.noconfig.outcome == 'success' && ':white_check_mark: pass' || ':x: fail' }} | \`${{ steps.noconfig.outputs.value }}\` |"
            echo "| API authz (401->201->200->409) | ${{ steps.api.outcome == 'success' && ':white_check_mark: pass' || ':x: fail' }} | \`${{ steps.api.outputs.value }}\` |"
            echo "| APIv2 Keycloak authn+authz | ${{ steps.apiv2.outcome == 'success' && ':white_check_mark: pass' || ':x: fail' }} | \`${{ steps.apiv2.outputs.value }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
