services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot: create the schema, then exit. Other services wait for it.
  migrate:
    build: .
    command: ["python", "-m", "common.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app

  dispatcher:
    build: .
    command: ["python", "-m", "dispatcher"]
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: jobs
      DISPATCHER_POLL_INTERVAL: "1.0"

  worker:
    build: .
    command: ["python", "-m", "worker"]
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: jobs
      CONSUMER_GROUP: workers
    # Scale horizontally up to the topic partition count:
    #   docker compose up --scale worker=3
    deploy:
      replicas: 1

  reaper:
    build: .
    command: ["python", "-m", "reaper"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REAPER_POLL_INTERVAL: "30.0"

  # Producer stand-in for AutoSys. Run on demand:
  #   docker compose run --rm handler hello '{"name":"Ada"}'
  handler:
    build: .
    entrypoint: ["python", "-m", "handler"]
    profiles: ["cli"]   # not started by `up`; use `docker compose run --rm handler ...`
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
