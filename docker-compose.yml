services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot: create the schema, then exit. Other services wait for it.
  migrate:
    build: .
    command: ["python", "-m", "common.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app

  dispatcher:
    build: .
    command: ["python", "-m", "dispatcher"]
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: jobs
      DISPATCHER_POLL_INTERVAL: "1.0"

  worker:
    build: .
    command: ["python", "-m", "worker"]
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: jobs
      CONSUMER_GROUP: workers
    # Scale horizontally up to the topic partition count:
    #   docker compose up --scale worker=3
    deploy:
      replicas: 1

  reaper:
    build: .
    command: ["python", "-m", "reaper"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REAPER_POLL_INTERVAL: "30.0"

  # Local stand-in for Ping Federate: an OIDC issuer with a JWKS endpoint.
  # Its client-credentials / auth-code tokens carry the aud + scope claims the
  # API expects (see deploy/mock-oidc.json). NOT for production.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/mock-oidc.json:/config/config.json:ro
    environment:
      JSON_CONFIG_PATH: /config/config.json

  # The HTTP front door (long-running FastAPI service). Validates Ping-issued
  # bearer tokens and reuses the shared enqueue transaction.
  handlerapi:
    build:
      context: .
      dockerfile: handlerAPI/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-oidc:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      OIDC_ISSUER: http://mock-oidc:8080/default
      OIDC_AUDIENCE: job-api
      OIDC_JWKS_URL: http://mock-oidc:8080/default/jwks
      RATE_LIMIT: 120/minute

  # Real Keycloak issuer for handlerAPIv2 (the v2 local-dev IdP; stands in for
  # the token source that, in prod, sits behind Apigee). Imports the `jobs`
  # realm with M2M client_credentials clients + jobs.read/jobs.write scopes and
  # an audience mapper (aud=job-api). Dev mode: the token issuer is derived from
  # the request host, so tokens minted at `keycloak:8080` match the API's
  # OIDC_ISSUER. NOT for production.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "8083:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

  # The v2 HTTP front door: a plain JWT resource server that sits behind an
  # Apigee proxy in prod. Locally it validates Keycloak-issued tokens directly
  # (no gateway in the loop). DATABASE_URL is set here, so the PostgresStore
  # takes over; unset it and the same code falls back to the in-memory store.
  handlerapiv2:
    build:
      context: .
      dockerfile: handlerAPIv2/Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      OIDC_ISSUER: http://keycloak:8080/realms/jobs
      OIDC_AUDIENCE: job-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/jobs/protocol/openid-connect/certs

  # Producer stand-in for AutoSys. Run on demand:
  #   docker compose run --rm handler hello '{"name":"Ada"}'
  handler:
    build: .
    entrypoint: ["python", "-m", "handler"]
    profiles: ["cli"]   # not started by `up`; use `docker compose run --rm handler ...`
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
